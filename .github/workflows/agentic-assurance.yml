name: Agentic software assurance (changed lines)
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  agentic-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard self-test
        run: python3 scripts/agentic_guard.py --self-test
      - name: Review added code and CI lines
        run: python3 scripts/agentic_guard.py --base "origin/$GITHUB_BASE_REF"
